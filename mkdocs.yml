site_name: BuildGuide
# the browser tests build with SITE_URL=http://127.0.0.1:8080/: instant navigation only follows links to URLs of the sitemap, which has the site_url
site_url: !ENV [SITE_URL, 'https://openreloading.github.io/BuildGuide/']
site_description: Interactive build guides from one data file, with the MkDocs plugin and the core browser library.
repo_url: https://github.com/OpenReloading/BuildGuide
repo_name: OpenReloading/BuildGuide
copyright: MIT license

theme:
  name: material
  custom_dir: overrides   # partials/source.html: header facts rendered at build time
  font: false   # system fonts: no requests outside the site
  features:
    - navigation.instant   # pages swap without a reload: the components must follow
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/repo-widget.css
  - assets/buildguide-material.css   # the Material recipe of docs/theming.md

plugins:
  - search
  - buildguide:
      data: packages/core/example/guide.json
      guides:
        minimal: packages/core/example/minimal/all.json   # example/second.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

validation:
  links:
    anchors: warn
    unrecognized_links: warn

# agent instructions in docs/agents/ and the hooks are not pages
exclude_docs: |
  agents/
  hooks/

hooks:
  - docs/hooks/reference.py
  - docs/hooks/repo_facts.py
  - docs/hooks/edition.py

nav:
  - Home: index.md
  - Getting started:
      - Plain HTML: core.md
      - MkDocs: mkdocs.md
      - Docusaurus: docusaurus.md
  - Examples: examples.md
  - Data format: data-format.md
  - Theming and dark mode: theming.md
  - Reference: reference.md
  - Testing your site: testing.md
  - Offline use: offline.md
  - Example guide:
      - Introduction: example/index.md
      - BOM: example/bom.md
      - Wiring: example/wiring.md
      - Tubing: example/tubing.md
      - All components: example/all.md
      - Combined: example/guide.md
      - Two guides: example/second.md
