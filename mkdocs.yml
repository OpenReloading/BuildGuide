site_name: BuildGuide
site_url: https://openreloading.github.io/BuildGuide/
site_description: Interactive build guides from one data file, with the MkDocs plugin and the core browser library.
copyright: MIT license

theme:
  name: material
  font: false   # system fonts: no requests outside the site
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - buildguide:
      data: packages/core/example/guide.json

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

validation:
  links:
    anchors: warn
    unrecognized_links: warn

# agent instructions in docs/agents/ are not pages
exclude_docs: |
  agents/

nav:
  - Home: index.md
  - Core: core.md
  - MkDocs plugin: mkdocs.md
  - Docusaurus plugin: docusaurus.md
  - Data format: data-format.md
  - Example guide:
      - Introduction: example/index.md
      - BOM: example/bom.md
      - Wiring: example/wiring.md
      - Tubing: example/tubing.md
      - All components: example/all.md
