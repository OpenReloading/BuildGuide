site_name: BuildGuide
# the browser tests build with SITE_URL=http://127.0.0.1:8080/: instant navigation only follows links to URLs of the sitemap, which has the site_url
site_url: !ENV [SITE_URL, 'https://openreloading.github.io/BuildGuide/']
site_description: Interactive build guides from one data file, with the MkDocs plugin and the core browser library.
copyright: MIT license

theme:
  name: material
  font: false   # system fonts: no requests outside the site
  features:
    - navigation.instant   # pages swap without a reload: the components must follow
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - buildguide:
      data: packages/core/example/guide.json

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

validation:
  links:
    anchors: warn
    unrecognized_links: warn

# agent instructions in docs/agents/ and the generator hook are not pages
exclude_docs: |
  agents/
  hooks/

hooks:
  - docs/hooks/reference.py

nav:
  - Home: index.md
  - Getting started:
      - Plain HTML: core.md
      - MkDocs: mkdocs.md
      - Docusaurus: docusaurus.md
  - Data format: data-format.md
  - Theming and dark mode: theming.md
  - Reference: reference.md
  - Migration: migration.md
  - Example guide:
      - Introduction: example/index.md
      - BOM: example/bom.md
      - Wiring: example/wiring.md
      - Tubing: example/tubing.md
      - All components: example/all.md
