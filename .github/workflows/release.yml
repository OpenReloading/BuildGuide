name: Release
# release-please keeps one release PR. Merging it tags each changed component (<component>-vX.Y.Z) and creates its
# GitHub Release. A release made with GITHUB_TOKEN starts no other workflow, so the assets are built here.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'OpenReloading/BuildGuide'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  core:
    needs: release-please
    if: needs.release-please.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.core-tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run dist -w packages/core
      - name: Attach the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.core-tag }}
        run: gh release upload "$TAG" packages/core/dist/*.tar.gz packages/core/dist/SHA256SUMS --clobber
