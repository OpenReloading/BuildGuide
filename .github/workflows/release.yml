name: Release
# release-please keeps one release PR. Merging it tags each changed component (<component>-vX.Y.Z) and creates its
# GitHub Release; the assets are built here. release-please works with the RELEASE_PLEASE_TOKEN secret (fine-grained
# token, this repository only, Contents and Pull requests read and write): a PR opened with GITHUB_TOKEN has its CI runs
# held until a maintainer approves them, so its required checks report only then. Without the secret it falls back
# to GITHUB_TOKEN.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'OpenReloading/BuildGuide'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      mkdocs: ${{ steps.release.outputs['packages/mkdocs--release_created'] }}
      mkdocs-tag: ${{ steps.release.outputs['packages/mkdocs--tag_name'] }}
      docusaurus: ${{ steps.release.outputs['packages/docusaurus--release_created'] }}
      docusaurus-tag: ${{ steps.release.outputs['packages/docusaurus--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  core:
    needs: release-please
    if: needs.release-please.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.core-tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run dist -w packages/core
      - name: Attach the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.core-tag }}
        run: gh release upload "$TAG" packages/core/dist/*.tar.gz packages/core/dist/SHA256SUMS --clobber
  mkdocs:
    needs: release-please
    if: needs.release-please.outputs.mkdocs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.mkdocs-tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      - run: uv build packages/mkdocs
      - name: Attach the wheel and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.mkdocs-tag }}
        run: gh release upload "$TAG" packages/mkdocs/dist/*.whl packages/mkdocs/dist/*.tar.gz --clobber
  docusaurus:
    needs: release-please
    if: needs.release-please.outputs.docusaurus == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.docusaurus-tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # prepack copies packages/core/src into the package (#7)
      - run: npm run dist -w packages/docusaurus
      - name: Attach the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.docusaurus-tag }}
        run: gh release upload "$TAG" packages/docusaurus/dist/*.tgz --clobber
