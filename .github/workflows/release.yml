name: Release
# release-please keeps one release PR. Merging it tags each changed component (<component>-vX.Y.Z) and creates its
# GitHub Release; the assets are built here. release-weekly.yml merges the release PR every Monday and dispatches this
# workflow after the merge; the owner can also merge the PR by hand. release-please runs as the org's release GitHub App (variable
# RELEASE_APP_CLIENT_ID, secret RELEASE_APP_PRIVATE_KEY): PRs opened with GITHUB_TOKEN wait for a maintainer to approve
# their workflow runs, the App's PRs run them. GitHub signs the App's API commits, which main requires.
# Publishing to GitHub Packages is off until the repository variable NPM_PUBLISH is `true`; the archives and wheels are
# still attached to the GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'OpenReloading/BuildGuide'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      mkdocs: ${{ steps.release.outputs['packages/mkdocs--release_created'] }}
      mkdocs-tag: ${{ steps.release.outputs['packages/mkdocs--tag_name'] }}
      docusaurus: ${{ steps.release.outputs['packages/docusaurus--release_created'] }}
      docusaurus-tag: ${{ steps.release.outputs['packages/docusaurus--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  core:
    needs: release-please
    if: needs.release-please.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.core-tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm run dist -w packages/core
      - name: Attach the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.core-tag }}
        run: gh release upload "$TAG" packages/core/dist/*.tar.gz packages/core/dist/SHA256SUMS --clobber
      - name: Publish to GitHub Packages
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish -w packages/core # zizmor: ignore[use-trusted-publishing] GitHub Packages has no trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
  mkdocs:
    needs: release-please
    if: needs.release-please.outputs.mkdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.mkdocs-tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 0.13.4
          enable-cache: false
      - run: uv build packages/mkdocs
      - name: Attach the wheel and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.mkdocs-tag }}
        run: gh release upload "$TAG" packages/mkdocs/dist/*.whl packages/mkdocs/dist/*.tar.gz --clobber
  docusaurus:
    needs: release-please
    if: needs.release-please.outputs.docusaurus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.docusaurus-tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      # prepack copies packages/core/src into the package (#7)
      - run: npm run dist -w packages/docusaurus
      - name: Attach the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.docusaurus-tag }}
        run: gh release upload "$TAG" packages/docusaurus/dist/*.tgz --clobber
      - name: Publish to GitHub Packages
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish -w packages/docusaurus # zizmor: ignore[use-trusted-publishing] GitHub Packages has no trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
