name: Pages
# The docs site with the live example guide, built with the MkDocs plugin: main at the root, develop as a preview under /develop/ (one Pages deployment holds both).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'OpenReloading/BuildGuide'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: develop-checkout
        continue-on-error: true
        with:
          ref: develop
          path: develop
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: false
      # the header's repository facts come from the GitHub API at build time
      - name: Build the released site (main)
        working-directory: main
        run: uv run --locked --no-build --project packages/mkdocs mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # a failing preview must not block the released site: it only drops out with a warning
      - name: Build the preview (develop)
        id: preview
        if: steps.develop-checkout.outcome == 'success'
        continue-on-error: true
        working-directory: develop
        run: uv run --locked --no-build --project packages/mkdocs mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDGUIDE_PREVIEW: 'true'
          SITE_URL: https://openreloading.github.io/BuildGuide/develop/
      - name: Combine
        env:
          PREVIEW: ${{ steps.preview.outcome }}
        run: |
          cp -a main/site pages
          if [ "$PREVIEW" = success ]; then
            # every preview page must carry noindex and the banner, the released site neither
            missing=$(grep -rL --include='*.html' 'name="robots" content="noindex' develop/site; grep -rL --include='*.html' 'md-banner' develop/site)
            test -z "$missing" || { echo "::error::preview pages without noindex or banner: $missing"; exit 1; }
            if grep -rlE --include='*.html' 'noindex|md-banner' main/site; then echo "::error::the released site carries preview markers"; exit 1; fi
            cp -a develop/site pages/develop
          else
            echo "::warning title=Preview skipped::the develop build did not succeed, the released site deploys without /develop/"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
