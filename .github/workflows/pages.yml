name: Pages
# One site, one deployment (a Pages deployment replaces the whole site): the latest release, built from its tag, at the
# root, and main under /next/ (site/, Docusaurus; DOCS_BASE_URL sets the path). Without a release, or with a release from
# before the edition handling (MkDocs: docs/hooks/edition.py), the root redirects to /next/. A release is published when
# the release pull request is merged (release.yml; weekly on Monday by release-weekly.yml, or by the owner); that
# publication, a push to main and a manual run rebuild the site.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
env:
  SITE: https://openreloading.github.io/BuildGuide/
jobs:
  build:
    if: github.repository == 'OpenReloading/BuildGuide'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # the latest release of the repository (three components are released together, three tags on one commit)
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/err.txt"); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/err.txt"; then
            echo "tag=" >> "$GITHUB_OUTPUT" # no release yet
          else
            cat "$RUNNER_TEMP/err.txt"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: next
          persist-credentials: false
      - if: steps.latest.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.latest.outputs.tag }}
          path: stable
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: next/.nvmrc
          # no npm cache: this job builds what is deployed (zizmor cache-poisoning)
          package-manager-cache: false
      # shortcut: releases up to the MkDocs docs site build it with uv; drop uv and the mkdocs branch below once the latest release has site/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.4
          enable-cache: false
      # first, since a build empties its output folder: the next edition goes into site/next/ below
      # the navbar's repository facts come from the GitHub API at build time
      - name: Build the stable site into the root
        if: steps.latest.outputs.tag != ''
        working-directory: stable
        run: |
          if [ -f site/package.json ]; then
            npm ci --ignore-scripts
            npm run build -w site -- --out-dir "$GITHUB_WORKSPACE/site"
          elif [ -f docs/hooks/edition.py ]; then
            uv run --locked --no-build --project packages/mkdocs mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/site"
          else
            echo "::notice::$TAG has no edition handling: the root redirects to /next/"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
      # the next edition keeps its own browser storage names (site/scripts/edition.mts) and its own base path
      - name: Build main into /next/
        working-directory: next
        run: |
          npm ci --ignore-scripts
          npm run build -w site -- --out-dir "$GITHUB_WORKSPACE/site/next"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDGUIDE_EDITION: next
          DOCS_BASE_URL: /BuildGuide/next/
      - name: Redirect the root to /next/ without a stable site
        run: |
          [ -f site/index.html ] || printf '<!doctype html><meta charset="utf-8"><title>BuildGuide</title><meta http-equiv="refresh" content="0; url=next/"><link rel="canonical" href="%snext/"><a href="next/">BuildGuide</a>\n' "$SITE" > site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
