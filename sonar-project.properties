sonar.organization=openreloading
sonar.projectKey=OpenReloading_BuildGuide

sonar.sources=packages/core/src,packages/mkdocs/src,packages/docusaurus/src
sonar.python.version=3.10
sonar.tests=packages/core/tests,packages/mkdocs/tests,packages/docusaurus/tests
# third-party code and the build copy of packages/core/src
sonar.exclusions=packages/core/src/vendor/**,packages/mkdocs/src/mkdocs_buildguide/core/**
# covered by the browser tests only
sonar.coverage.exclusions=packages/core/src/buildguide.js,packages/core/src/buildguide-board.js,packages/docusaurus/src/theme/**

# written by npm test
sonar.javascript.lcov.reportPaths=packages/core/lcov.info,packages/docusaurus/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
